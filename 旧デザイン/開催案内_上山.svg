<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d9ec"/>
      <stop offset="1" stop-color="#fdeef7"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b4a86"/>
      <stop offset="1" stop-color="#c86aa6"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5305a"/>
      <stop offset="1" stop-color="#7a1b3c"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="#fffafd"/>

  <!-- top banner -->
  <rect x="0" y="0" width="900" height="130" fill="url(#banner)"/>
  <text x="450" y="60" text-anchor="middle" font-size="46" font-weight="bold" fill="#fff">第1回 ベスコングルメ部</text>
  <text x="450" y="105" text-anchor="middle" font-size="30" font-weight="bold" fill="#f7e3f0">温泉街を歩いて、ととのえた体でワインと乾杯</text>

  <!-- illustration area -->
  <rect x="40" y="160" width="820" height="430" rx="20" fill="url(#sky)" stroke="#f0d4e6" stroke-width="2"/>

  <!-- sun -->
  <circle cx="760" cy="235" r="40" fill="#ffcf6b"/>

  <!-- castle (上山城) on hill -->
  <path d="M40 560 L300 360 L560 560 Z" fill="#aebf9a"/>
  <rect x="250" y="300" width="100" height="70" fill="#eceae0"/>
  <polygon points="240,300 360,300 300,262" fill="#5d7a9e"/>
  <polygon points="258,270 342,270 300,240" fill="#5d7a9e"/>
  <rect x="285" y="330" width="30" height="40" fill="#8a3b12"/>

  <!-- onsen building with steam -->
  <rect x="110" y="470" width="130" height="80" rx="6" fill="#d8b98a"/>
  <polygon points="100,470 250,470 175,435" fill="#b5651d"/>
  <g stroke="#cfe8f5" stroke-width="5" fill="none" opacity="0.9">
    <path d="M140 435 q-10 -20 5 -35 q10 -15 0 -30"/>
    <path d="M175 430 q-10 -20 5 -35 q10 -15 0 -30"/>
    <path d="M210 435 q-10 -20 5 -35 q10 -15 0 -30"/>
  </g>
  <text x="175" y="518" text-anchor="middle" font-size="34" fill="#7a1b3c">♨</text>

  <!-- walkers (3 members) -->
  <g>
    <circle cx="400" cy="520" r="12" fill="#f4c28a"/>
    <rect x="392" y="532" width="16" height="24" rx="6" fill="#e8502e"/>
    <circle cx="435" cy="520" r="12" fill="#f4c28a"/>
    <rect x="427" y="532" width="16" height="24" rx="6" fill="#2e78e8"/>
    <circle cx="470" cy="520" r="12" fill="#f4c28a"/>
    <rect x="462" y="532" width="16" height="24" rx="6" fill="#2eae63"/>
  </g>

  <!-- reward: wine glass + cheese -->
  <g transform="translate(610,410)">
    <!-- wine glass -->
    <path d="M40 20 L120 20 L108 70 Q80 100 80 100 Q80 100 52 70 Z" fill="url(#wine)"/>
    <ellipse cx="80" cy="24" rx="40" ry="8" fill="#7a1b3c"/>
    <rect x="76" y="100" width="8" height="55" fill="#c9a86a"/>
    <ellipse cx="80" cy="158" rx="34" ry="8" fill="#c9a86a"/>
    <!-- cheese -->
    <polygon points="150,120 230,120 230,160 150,160" fill="#f6d35a"/>
    <polygon points="150,120 230,120 210,105" fill="#ffe68a"/>
    <circle cx="175" cy="140" r="6" fill="#e8b94a"/>
    <circle cx="205" cy="135" r="5" fill="#e8b94a"/>
  </g>

  <!-- details card -->
  <rect x="40" y="620" width="820" height="315" rx="18" fill="#fff" stroke="#f0d4e6" stroke-width="2"/>
  <text x="70" y="665" font-size="30" font-weight="bold" fill="#9b4a86">開催概要</text>
  <g font-size="25" fill="#333">
    <text x="70" y="712">日時：2026年11月14日（土）9:30集合</text>
    <text x="70" y="752">集合：かみのやま温泉駅　※JR奥羽本線でアクセス</text>
    <text x="70" y="792">運動：城下町さんぽ＋上山城までの坂道ウォーク</text>
    <text x="70" y="832">食事：温泉でととのえてから、地元ワイン＆創作和食で乾杯</text>
    <text x="70" y="872">持ち物：歩きやすい靴・飲み物・（希望者は）入浴セット</text>
    <text x="70" y="898" font-size="19" fill="#777">※運動の強度を低めにできる回。温泉→乾杯の流れでコンディションを物理的に整えられる。</text>
    <text x="70" y="922" font-size="19" fill="#777">　9名・土曜夜は店が混むため事前予約を。入浴は日帰り温泉の利用時間を確認。</text>
  </g>

  <!-- timeline card -->
  <rect x="40" y="950" width="820" height="210" rx="18" fill="#fdf3fa" stroke="#f0d4e6" stroke-width="2"/>
  <text x="70" y="992" font-size="28" font-weight="bold" fill="#9b4a86">当日の流れ</text>
  <g font-size="21" fill="#444">
    <text x="70" y="1030">9:30　かみのやま温泉駅に集合</text>
    <text x="70" y="1060">9:45　城下町さんぽ・上山城へ</text>
    <text x="70" y="1090">11:00　上山城で記念撮影</text>
    <text x="440" y="1060">11:30　日帰り温泉でととのえる</text>
    <text x="440" y="1090">12:30　ワイン＆料理で乾杯</text>
  </g>

  <text x="450" y="1140" text-anchor="middle" font-size="19" fill="#999">幹事：部長　／　参加可否はこちらまで</text>
</svg>
