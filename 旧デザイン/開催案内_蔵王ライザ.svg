<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe4ff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6db5"/>
      <stop offset="1" stop-color="#4a9fd6"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f6b73c"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="#fbfdff"/>

  <!-- top banner -->
  <rect x="0" y="0" width="900" height="130" fill="url(#banner)"/>
  <text x="450" y="60" text-anchor="middle" font-size="46" font-weight="bold" fill="#fff">第1回 ベスコングルメ部</text>
  <text x="450" y="105" text-anchor="middle" font-size="30" font-weight="bold" fill="#e4f1ff">蔵王の高原を歩いて、整った体で石窯ピザと乾杯</text>

  <!-- illustration area -->
  <rect x="40" y="160" width="820" height="430" rx="20" fill="url(#sky)" stroke="#cfe0f2" stroke-width="2"/>

  <!-- sun -->
  <circle cx="760" cy="235" r="42" fill="#ffd34d"/>

  <!-- snowy mountains -->
  <path d="M40 560 L260 300 L440 500 L600 310 L760 560 Z" fill="#9fb8cf"/>
  <polygon points="260,300 220,360 300,360" fill="#fff"/>
  <polygon points="600,310 560,372 642,372" fill="#fff"/>

  <!-- gondola line -->
  <line x1="110" y1="520" x2="520" y2="340" stroke="#8a99a8" stroke-width="3"/>
  <rect x="300" y="415" width="34" height="24" rx="5" fill="#e8502e"/>

  <!-- hikers (3 members) -->
  <g>
    <circle cx="180" cy="520" r="12" fill="#f4c28a"/>
    <rect x="172" y="532" width="16" height="24" rx="6" fill="#e8502e"/>
    <circle cx="215" cy="522" r="12" fill="#f4c28a"/>
    <rect x="207" y="534" width="16" height="24" rx="6" fill="#2e78e8"/>
    <circle cx="250" cy="520" r="12" fill="#f4c28a"/>
    <rect x="242" y="532" width="16" height="24" rx="6" fill="#2eae63"/>
  </g>

  <!-- reward: pizza + beer -->
  <g transform="translate(600,420)">
    <!-- pizza -->
    <circle cx="70" cy="80" r="62" fill="#e8b96a"/>
    <circle cx="70" cy="80" r="62" fill="none" stroke="#c98a3b" stroke-width="6"/>
    <circle cx="70" cy="80" r="48" fill="#e86a3b"/>
    <circle cx="55" cy="65" r="9" fill="#fff4e0"/>
    <circle cx="92" cy="72" r="9" fill="#fff4e0"/>
    <circle cx="70" cy="100" r="9" fill="#fff4e0"/>
    <circle cx="50" cy="98" r="6" fill="#2eae63"/>
    <circle cx="95" cy="98" r="6" fill="#2eae63"/>
    <!-- beer mug -->
    <rect x="150" y="40" width="48" height="80" rx="6" fill="url(#beer)" stroke="#e0a62b" stroke-width="2"/>
    <rect x="150" y="32" width="48" height="18" rx="8" fill="#fffdf5"/>
    <rect x="196" y="58" width="18" height="40" rx="8" fill="none" stroke="#e0a62b" stroke-width="6"/>
  </g>

  <!-- details card -->
  <rect x="40" y="620" width="820" height="315" rx="18" fill="#fff" stroke="#d7e5f3" stroke-width="2"/>
  <text x="70" y="665" font-size="30" font-weight="bold" fill="#2f6db5">開催概要</text>
  <g font-size="25" fill="#333">
    <text x="70" y="712">日時：2026年11月14日（土）9:30集合</text>
    <text x="70" y="752">集合：蔵王ライザワールド　※現地集合（上山市蔵王）</text>
    <text x="70" y="792">運動：高原・ゲレンデ斜面の軽ハイクで標高差ウォーク</text>
    <text x="70" y="832">食事：ライザレストランでイタリア直輸入の石窯ピザ＆乾杯</text>
    <text x="70" y="872">持ち物：防寒着（必須）・歩きやすい靴・手袋・飲み物</text>
    <text x="70" y="898" font-size="19" fill="#c0392b">※11月中旬は冷え込み強め。防寒重視で、天候が悪ければ屋内中心に。</text>
    <text x="70" y="922" font-size="19" fill="#c0392b">　店の営業状況（冬季スキー場営業前）は事前に必ず確認を。</text>
  </g>

  <!-- timeline card -->
  <rect x="40" y="950" width="820" height="210" rx="18" fill="#f3f8ff" stroke="#d7e5f3" stroke-width="2"/>
  <text x="70" y="992" font-size="28" font-weight="bold" fill="#2f6db5">当日の流れ</text>
  <g font-size="21" fill="#444">
    <text x="70" y="1030">9:30　蔵王ライザに集合・準備運動</text>
    <text x="70" y="1060">9:45　高原を各自のペースでハイク</text>
    <text x="70" y="1090">11:00　見晴らしポイントで記念撮影</text>
    <text x="470" y="1060">11:45　レストランへ移動</text>
    <text x="470" y="1090">12:00　石窯ピザで乾杯・次回ゴール相談</text>
  </g>

  <text x="450" y="1140" text-anchor="middle" font-size="19" fill="#999">幹事：部長　／　参加可否はこちらまで</text>
</svg>
