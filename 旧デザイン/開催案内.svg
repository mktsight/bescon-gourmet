<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee1f9"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8502e"/>
      <stop offset="1" stop-color="#f5873b"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f6b73c"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="900" height="1200" fill="#fffdf7"/>

  <!-- top banner -->
  <rect x="0" y="0" width="900" height="130" fill="url(#banner)"/>
  <text x="450" y="60" text-anchor="middle" font-size="46" font-weight="bold" fill="#fff">第1回 ベスコングルメ部</text>
  <text x="450" y="105" text-anchor="middle" font-size="30" font-weight="bold" fill="#fff2e0">山寺の石段を登って、整った体で板そばと乾杯</text>

  <!-- illustration area -->
  <rect x="40" y="160" width="820" height="430" rx="20" fill="url(#sky)" stroke="#cfe8f5" stroke-width="2"/>

  <!-- sun -->
  <circle cx="760" cy="240" r="42" fill="#ffd34d"/>

  <!-- mountain -->
  <path d="M40 560 L250 320 L420 480 L560 300 L760 560 Z" fill="#8fb98a"/>
  <path d="M40 560 L250 320 L360 445 L300 560 Z" fill="#7aa876"/>

  <!-- temple on cliff -->
  <rect x="520" y="250" width="110" height="70" fill="#b5651d"/>
  <polygon points="505,250 645,250 575,210" fill="#8a3b12"/>
  <rect x="548" y="285" width="22" height="35" fill="#5d3410"/>
  <rect x="590" y="285" width="22" height="35" fill="#5d3410"/>

  <!-- stone stairs -->
  <g fill="#cdbfa6" stroke="#b3a488" stroke-width="1.5">
    <rect x="150" y="540" width="180" height="18"/>
    <rect x="165" y="512" width="165" height="18"/>
    <rect x="180" y="484" width="150" height="18"/>
    <rect x="195" y="456" width="135" height="18"/>
    <rect x="210" y="428" width="120" height="18"/>
    <rect x="225" y="400" width="105" height="18"/>
  </g>

  <!-- climbers (3 members) -->
  <g>
    <!-- member 1 -->
    <circle cx="230" cy="518" r="12" fill="#f4c28a"/>
    <rect x="222" y="530" width="16" height="24" rx="6" fill="#e8502e"/>
    <!-- member 2 -->
    <circle cx="265" cy="490" r="12" fill="#f4c28a"/>
    <rect x="257" y="502" width="16" height="24" rx="6" fill="#2e78e8"/>
    <!-- member 3 -->
    <circle cx="300" cy="462" r="12" fill="#f4c28a"/>
    <rect x="292" y="474" width="16" height="24" rx="6" fill="#2eae63"/>
  </g>

  <!-- reward: soba + beer -->
  <g transform="translate(620,430)">
    <!-- soba tray -->
    <rect x="-10" y="60" width="150" height="60" rx="8" fill="#6b4a2b"/>
    <rect x="0" y="52" width="130" height="26" rx="6" fill="#8a6239"/>
    <ellipse cx="65" cy="60" rx="55" ry="14" fill="#efe6d2"/>
    <path d="M20 58 Q65 48 110 58" stroke="#c9b78f" stroke-width="3" fill="none"/>
    <path d="M25 62 Q65 54 105 62" stroke="#c9b78f" stroke-width="3" fill="none"/>
    <!-- beer mug -->
    <rect x="140" y="30" width="48" height="80" rx="6" fill="url(#beer)" stroke="#e0a62b" stroke-width="2"/>
    <rect x="140" y="22" width="48" height="18" rx="8" fill="#fffdf5"/>
    <rect x="186" y="48" width="18" height="40" rx="8" fill="none" stroke="#e0a62b" stroke-width="6"/>
  </g>

  <!-- details card -->
  <rect x="40" y="620" width="820" height="315" rx="18" fill="#fff" stroke="#f0d9c8" stroke-width="2"/>
  <text x="70" y="665" font-size="30" font-weight="bold" fill="#e8502e">開催概要</text>
  <g font-size="25" fill="#333">
    <text x="70" y="712">日時：2026年11月14日（土）9:30集合</text>
    <text x="70" y="752">集合：山寺（立石寺）登山口　※JR仙山線「山寺駅」すぐ</text>
    <text x="70" y="792">運動：立石寺の石段 約1015段を登頂</text>
    <text x="70" y="832">食事：下山後、ふもとや本店で板そば＆乾杯</text>
    <text x="70" y="872">持ち物：滑りにくい靴・動ける服装・飲み物・防寒着</text>
    <text x="70" y="898" font-size="19" fill="#777">※9名・土曜昼は混雑のため店は事前予約。</text>
    <text x="70" y="922" font-size="19" fill="#777">　きつい人は途中の見晴らし台をゴールにしてもOK</text>
  </g>

  <!-- timeline card -->
  <rect x="40" y="950" width="820" height="210" rx="18" fill="#fff8f0" stroke="#f0d9c8" stroke-width="2"/>
  <text x="70" y="992" font-size="28" font-weight="bold" fill="#e8502e">当日の流れ</text>
  <g font-size="21" fill="#444">
    <text x="70" y="1030">9:30　登山口に集合・準備運動</text>
    <text x="70" y="1060">9:45　石段を各自のペースで登る</text>
    <text x="70" y="1090">11:00　奥之院で登頂・全員で記念撮影</text>
    <text x="470" y="1060">11:45　下山してふもとや本店へ</text>
    <text x="470" y="1090">12:00　板そばで乾杯・次回ゴール相談</text>
  </g>

  <!-- footer -->
  <text x="450" y="1140" text-anchor="middle" font-size="19" fill="#999">幹事：部長　／　参加可否はこちらまで</text>
</svg>
